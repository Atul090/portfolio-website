<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atul Deep Singh — Portfolio v1 (archived)</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <style>
      html, body { height: 100%; margin: 0; }
      #root { height: 100%; }
      /* Archive notice. Lives here, outside the React app, so the v1 source stays untouched. */
      #v1-notice {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 10000;
        display: flex; justify-content: center; align-items: center; gap: 0.5rem; flex-wrap: wrap;
        padding: 0.65rem 1rem;
        background: #0d0f14; color: #969ba8; border-top: 1px solid #282c36;
        font: 12px/1.4 'JetBrains Mono', ui-monospace, monospace;
        letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none;
      }
      #v1-notice strong { color: #00ffc2; font-weight: 500; }
      #v1-notice:hover strong { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div style="height: 2.75rem" aria-hidden="true"></div>
    <a id="v1-notice" href="/">
      <span>Archived · v1 of this site</span>
      <strong>View the current version →</strong>
    </a>
    <script type="module" src="/original-src/main.tsx"></script>
  </body>
</html>
